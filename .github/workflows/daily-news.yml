name: Daily News Digest

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */3 * * *"  # 每 3 小时运行一次
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: |
          pip install feedparser requests lxml

      - name: Generate news digest
        run: |
          echo "=== Starting digest generation ==="
          python -m src.digest_pipeline 2>&1
          echo "=== Pipeline completed ==="
          ls -la latest.html latest.json

      - name: Copy digest to public site
        run: |
          mkdir -p public/news
          cp latest.html public/news/latest.html
          cp latest.json public/news/latest.json
          ls -la public public/news

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update news: $(date '+%Y-%m-%d %H:%M')" || exit 0
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
